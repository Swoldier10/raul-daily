<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily — Raul</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #7aa2ff;
      --ok: #3dd68c;
      --border: #2a2f3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding: 1rem 1rem 3rem;
    }
    header {
      max-width: 720px;
      margin: 0 auto 1.25rem;
    }
    h1 { font-size: 1.55rem; margin: 0 0 .35rem; font-weight: 650; }
    .meta { color: var(--muted); font-size: .9rem; }
    main { max-width: 720px; margin: 0 auto; display: grid; gap: 1rem; }
    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1rem .75rem;
    }
    h2 {
      font-size: .85rem;
      margin: 0 0 .75rem;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--accent);
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li.task {
      display: flex;
      gap: .75rem;
      align-items: flex-start;
      padding: .65rem 0;
      border-top: 1px solid var(--border);
    }
    li.task:first-child { border-top: none; }
    input[type=checkbox] {
      width: 1.25rem;
      height: 1.25rem;
      margin-top: .15rem;
      accent-color: var(--ok);
      flex-shrink: 0;
    }
    .title { flex: 1; }
    .title.done { text-decoration: line-through; color: var(--muted); }
    .sub { display: block; color: var(--muted); font-size: .8rem; margin-top: .15rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .error {
      background: #3a1f24;
      border-color: #6b3038;
      color: #ffb4b4;
    }
    .empty { color: var(--muted); font-size: .9rem; }
    article.news {
      padding: .85rem 0;
      border-top: 1px solid var(--border);
    }
    article.news:first-of-type { border-top: none; padding-top: .15rem; }
    article.news h3 {
      margin: 0 0 .4rem;
      font-size: 1.02rem;
      font-weight: 600;
      line-height: 1.35;
    }
    article.news h3 a { color: var(--text); }
    article.news h3 a:hover { color: var(--accent); }
    article.news .summary {
      margin: 0 0 .45rem;
      color: #c5c9d1;
      font-size: .92rem;
      line-height: 1.5;
    }
    article.news .meta-row {
      font-size: .78rem;
      color: var(--muted);
      display: flex;
      gap: .75rem;
      flex-wrap: wrap;
      align-items: center;
    }
    article.news .more {
      font-weight: 500;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="greeting">Bună, Raul</h1>
    <div class="meta" id="meta">Se încarcă…</div>
  </header>
  <main id="app"></main>
  <script>
    const DATE_KEY = () => new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Europe/Bucharest', year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date());

    function greetingForNow() {
      const hour = Number(new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Europe/Bucharest', hour: 'numeric', hour12: false
      }).format(new Date()));
      if (hour < 12) return 'Bună dimineața, Raul';
      if (hour < 18) return 'Bună ziua, Raul';
      return 'Bună seara, Raul';
    }

    const storageKey = (date) => `daily-checks:${date}`;
    function loadChecks(date) {
      try { return JSON.parse(localStorage.getItem(storageKey(date)) || '{}'); }
      catch { return {}; }
    }
    function saveChecks(date, map) {
      localStorage.setItem(storageKey(date), JSON.stringify(map));
    }

    function taskRow(item, checks, onToggle, kind) {
      const id = `${kind}:${item.id}`;
      const checked = !!checks[id];
      const li = document.createElement('li');
      li.className = 'task';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = checked;
      cb.addEventListener('change', () => onToggle(id, cb.checked));
      const wrap = document.createElement('div');
      wrap.className = 'title' + (checked ? ' done' : '');
      if (item.url) {
        const a = document.createElement('a');
        a.href = item.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = item.title;
        wrap.appendChild(a);
      } else {
        wrap.appendChild(document.createTextNode(item.title));
      }
      const bits = [];
      if (item.project) bits.push(item.project);
      if (item.due) bits.push('due ' + item.due);
      if (bits.length) {
        const sub = document.createElement('span');
        sub.className = 'sub';
        sub.textContent = bits.join(' · ');
        wrap.appendChild(sub);
      }
      li.appendChild(cb);
      li.appendChild(wrap);
      return li;
    }

    function taskSection(title, items, checks, onToggle, kind) {
      const sec = document.createElement('section');
      const h = document.createElement('h2');
      h.textContent = title;
      sec.appendChild(h);
      if (!items || !items.length) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = 'Nimic aici.';
        sec.appendChild(p);
        return sec;
      }
      const ul = document.createElement('ul');
      items.forEach(it => ul.appendChild(taskRow(it, checks, onToggle, kind)));
      sec.appendChild(ul);
      return sec;
    }

    function newsSection(title, items) {
      const sec = document.createElement('section');
      const h = document.createElement('h2');
      h.textContent = title;
      sec.appendChild(h);
      if (!items || !items.length) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = 'Nimic aici.';
        sec.appendChild(p);
        return sec;
      }
      items.forEach(it => {
        const art = document.createElement('article');
        art.className = 'news';
        const h3 = document.createElement('h3');
        if (it.url) {
          const a = document.createElement('a');
          a.href = it.url;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = it.title;
          h3.appendChild(a);
        } else {
          h3.textContent = it.title;
        }
        art.appendChild(h3);
        if (it.summary) {
          const p = document.createElement('p');
          p.className = 'summary';
          p.textContent = it.summary;
          art.appendChild(p);
        }
        const meta = document.createElement('div');
        meta.className = 'meta-row';
        if (it.source) {
          const s = document.createElement('span');
          s.textContent = it.source;
          meta.appendChild(s);
        }
        if (it.url) {
          const more = document.createElement('a');
          more.className = 'more';
          more.href = it.url;
          more.target = '_blank';
          more.rel = 'noopener';
          more.textContent = 'Citește mai mult';
          meta.appendChild(more);
        }
        art.appendChild(meta);
        sec.appendChild(art);
      });
      return sec;
    }

    async function main() {
      document.getElementById('greeting').textContent = greetingForNow();
      const app = document.getElementById('app');
      const meta = document.getElementById('meta');
      try {
        const res = await fetch('data.json?ts=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const date = data.date || DATE_KEY();
        meta.textContent = date + (data.updatedAt ? ' · actualizat ' + data.updatedAt : '');
        let checks = loadChecks(date);
        const onToggle = (id, val) => {
          checks[id] = val;
          saveChecks(date, checks);
          main();
        };
        app.innerHTML = '';
        app.appendChild(taskSection('Trebuie azi (5)', data.must || [], checks, onToggle, 'must'));
        app.appendChild(taskSection('Opțional (3)', data.optional || [], checks, onToggle, 'opt'));
        app.appendChild(taskSection('Todos personale', data.todos || [], checks, onToggle, 'todo'));
        app.appendChild(newsSection('Top news — 24h', data.news || []));
        app.appendChild(newsSection('Top AI — 24h', data.aiNews || []));
      } catch (e) {
        app.innerHTML = '';
        const sec = document.createElement('section');
        sec.className = 'error';
        sec.textContent = 'Nu pot încărca data.json: ' + e.message;
        app.appendChild(sec);
        meta.textContent = DATE_KEY();
      }
    }
    main();
  </script>
</body>
</html>
