<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily — Raul</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #7aa2ff;
      --ok: #3dd68c;
      --border: #2a2f3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding: 1rem 1rem 3rem;
    }
    header {
      max-width: 720px;
      margin: 0 auto 1.25rem;
    }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    .meta { color: var(--muted); font-size: .9rem; }
    main { max-width: 720px; margin: 0 auto; display: grid; gap: 1rem; }
    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1rem .75rem;
    }
    h2 {
      font-size: 1rem;
      margin: 0 0 .75rem;
      letter-spacing: .02em;
      text-transform: uppercase;
      color: var(--accent);
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      gap: .75rem;
      align-items: flex-start;
      padding: .65rem 0;
      border-top: 1px solid var(--border);
    }
    li:first-child { border-top: none; }
    input[type=checkbox] {
      width: 1.25rem;
      height: 1.25rem;
      margin-top: .15rem;
      accent-color: var(--ok);
      flex-shrink: 0;
    }
    .title { flex: 1; }
    .title.done { text-decoration: line-through; color: var(--muted); }
    .sub { display: block; color: var(--muted); font-size: .8rem; margin-top: .15rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .error {
      background: #3a1f24;
      border-color: #6b3038;
      color: #ffb4b4;
    }
    .empty { color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <header>
    <h1>Daily</h1>
    <div class="meta" id="meta">Se încarcă…</div>
  </header>
  <main id="app"></main>
  <script>
    const DATE_KEY = () => {
      // Europe/Bucharest calendar date
      return new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Europe/Bucharest', year: 'numeric', month: '2-digit', day: '2-digit'
      }).format(new Date());
    };
    const storageKey = (date) => `daily-checks:${date}`;

    function loadChecks(date) {
      try { return JSON.parse(localStorage.getItem(storageKey(date)) || '{}'); }
      catch { return {}; }
    }
    function saveChecks(date, map) {
      localStorage.setItem(storageKey(date), JSON.stringify(map));
    }

    function itemRow(item, checks, onToggle, kind) {
      const id = `${kind}:${item.id}`;
      const checked = !!checks[id];
      const li = document.createElement('li');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = checked;
      cb.addEventListener('change', () => onToggle(id, cb.checked));
      const wrap = document.createElement('div');
      wrap.className = 'title' + (checked ? ' done' : '');
      if (item.url) {
        const a = document.createElement('a');
        a.href = item.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = item.title;
        wrap.appendChild(a);
      } else {
        wrap.appendChild(document.createTextNode(item.title));
      }
      const bits = [];
      if (item.project) bits.push(item.project);
      if (item.due) bits.push('due ' + item.due);
      if (item.source) bits.push(item.source);
      if (bits.length) {
        const sub = document.createElement('span');
        sub.className = 'sub';
        sub.textContent = bits.join(' · ');
        wrap.appendChild(sub);
      }
      li.appendChild(cb);
      li.appendChild(wrap);
      return li;
    }

    function section(title, items, checks, onToggle, kind) {
      const sec = document.createElement('section');
      const h = document.createElement('h2');
      h.textContent = title;
      sec.appendChild(h);
      if (!items || !items.length) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = 'Nimic aici.';
        sec.appendChild(p);
        return sec;
      }
      const ul = document.createElement('ul');
      items.forEach(it => ul.appendChild(itemRow(it, checks, onToggle, kind)));
      sec.appendChild(ul);
      return sec;
    }

    async function main() {
      const app = document.getElementById('app');
      const meta = document.getElementById('meta');
      try {
        const res = await fetch('data.json?ts=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const date = data.date || DATE_KEY();
        meta.textContent = date + (data.updatedAt ? ' · actualizat ' + data.updatedAt : '');
        let checks = loadChecks(date);
        const onToggle = (id, val) => {
          checks[id] = val;
          saveChecks(date, checks);
          // refresh strike-through without full reload
          main();
        };
        app.innerHTML = '';
        app.appendChild(section('Trebuie azi (5)', data.must || [], checks, onToggle, 'must'));
        app.appendChild(section('Opțional (3)', data.optional || [], checks, onToggle, 'opt'));
        app.appendChild(section('Todos personale', data.todos || [], checks, onToggle, 'todo'));
        app.appendChild(section('Top news — 24h', data.news || [], checks, onToggle, 'news'));
        app.appendChild(section('AI & Space — 24h', data.aiNews || [], checks, onToggle, 'ai'));
      } catch (e) {
        app.innerHTML = '';
        const sec = document.createElement('section');
        sec.className = 'error';
        sec.textContent = 'Nu pot încărca data.json: ' + e.message;
        app.appendChild(sec);
        meta.textContent = DATE_KEY();
      }
    }
    main();
  </script>
</body>
</html>
